name: Fill Short Schedule

on:
  schedule:
    # Right after YouTube's upload counter resets at midnight Pacific (08:00 UTC).
    - cron: '5 8 * * *'
  workflow_dispatch:
    inputs:
      count:
        description: 'Slots to add (default 10)'
        required: false
        default: '10'
      dry_run:
        description: Render the Shorts but skip the YouTube upload
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: travel-short
  cancel-in-progress: false

jobs:
  fill:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore credentials and API keys
        env:
          YOUTUBE_CREDENTIALS_JSON: ${{ secrets.YOUTUBE_CREDENTIALS_JSON }}
          YOUTUBE_TOKENS_JSON: ${{ secrets.YOUTUBE_TOKENS_JSON }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          mkdir -p config data
          printf '%s' "$YOUTUBE_CREDENTIALS_JSON" > config/credentials.json
          printf '%s' "$YOUTUBE_TOKENS_JSON" > config/tokens.json
          {
            echo "NODE_ENV=production"
            echo "PIXABAY_API_KEY=$PIXABAY_API_KEY"
            echo "DEFAULT_PRIVACY_STATUS=public"
          } > .env

      - name: Fill the publish slots
        env:
          SHORTS_FILL_COUNT: ${{ inputs.count || '10' }}
          SHORTS_DRY_RUN: ${{ inputs.dry_run }}
          SHORTS_FORMAT: viral
        run: node scripts/ci-fill-queue.js

      - name: Keep the rendered Shorts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shorts-fill-${{ github.run_id }}
          path: |
            data/ranked-shorts/**/final.mp4
            data/ranked-shorts/**/thumbnail.jpg
            data/ranked-shorts/**/episode.json
          if-no-files-found: ignore
          retention-days: 14
