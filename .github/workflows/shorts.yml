name: Travel Short

on:
  schedule:
    # Upload ahead of time and let YouTube publish at the exact slot. GitHub's
    # scheduler can run hours late, so the publish time never depends on it.
    - cron: '30 1 * * *'   # prepare the 09:30 UTC (15:00 IST) Short
    - cron: '30 4 * * *'   # retry for the 09:30 UTC Short
    - cron: '30 9 * * *'   # prepare the 16:30 UTC (22:00 IST) Short
    - cron: '30 12 * * *'  # retry for the 16:30 UTC Short
    - cron: '30 16 * * *'  # prepare the next 01:30 UTC (07:00 IST) Short
    - cron: '30 19 * * *'  # retry for the next 01:30 UTC Short
  workflow_dispatch:
    inputs:
      topic:
        description: Destination override (optional)
        required: false
      slot:
        description: '0 = 01:30 UTC (07:00 IST), 1 = 09:30 UTC (15:00 IST), 2 = 16:30 UTC (22:00 IST)'
        required: false
        default: '0'
      format:
        description: 'viral (default), showcase, or ranked'
        required: false
        default: 'viral'
      publish_at:
        description: 'Optional UTC publish time, e.g. 2026-10-30T16:30:00Z (default: now)'
        required: false
      dry_run:
        description: Render the Short but skip the YouTube upload
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: travel-short
  cancel-in-progress: false

jobs:
  setup:
    # Build the matrix here because a job-level `if` cannot read `matrix`.
    # The second channel stays disabled until ZENTROX_ENABLED is set to true.
    runs-on: ubuntu-latest
    outputs:
      channels: ${{ steps.channels.outputs.channels }}
    steps:
      - id: channels
        env:
          ZENTROX_ENABLED: ${{ vars.ZENTROX_ENABLED }}
        run: |
          if [ "$ZENTROX_ENABLED" = "true" ]; then
            echo 'channels=[{"channel":"primary","tokens":"config/tokens.json","offset":"0"},{"channel":"zentrox","tokens":"config/tokens.zentrox.json","offset":"5"}]' >> "$GITHUB_OUTPUT"
          else
            echo 'channels=[{"channel":"primary","tokens":"config/tokens.json","offset":"0"}]' >> "$GITHUB_OUTPUT"
          fi

  short:
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.setup.outputs.channels) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore credentials and API keys
        env:
          YOUTUBE_CREDENTIALS_JSON: ${{ secrets.YOUTUBE_CREDENTIALS_JSON }}
          YOUTUBE_TOKENS_JSON: ${{ secrets.YOUTUBE_TOKENS_JSON }}
          YOUTUBE_TOKENS_ZENTROX_JSON: ${{ secrets.YOUTUBE_TOKENS_ZENTROX_JSON }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          mkdir -p config data
          printf '%s' "$YOUTUBE_CREDENTIALS_JSON" > config/credentials.json
          printf '%s' "$YOUTUBE_TOKENS_JSON" > config/tokens.json
          if [ -n "${YOUTUBE_TOKENS_ZENTROX_JSON:-}" ]; then
            printf '%s' "$YOUTUBE_TOKENS_ZENTROX_JSON" > config/tokens.zentrox.json
          fi
          {
            echo "NODE_ENV=production"
            echo "PIXABAY_API_KEY=$PIXABAY_API_KEY"
            echo "DEFAULT_PRIVACY_STATUS=public"
          } > .env

      - name: Resolve publish target
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          INPUT_SLOT: ${{ inputs.slot }}
          INPUT_PUBLISH_AT: ${{ inputs.publish_at }}
        run: |
          set -euo pipefail
          # Pick the nearest occurrence of a slot so a run that crosses
          # midnight still targets the intended publish time.
          nearest_slot() {
            local hour="$1"
            local minute="$2"
            local now today_ts tomorrow_ts chosen_ts today_diff tomorrow_diff
            now="$(date -u +%s)"
            today_ts="$(date -u -d "today ${hour}:${minute}" +%s)"
            tomorrow_ts="$(date -u -d "tomorrow ${hour}:${minute}" +%s)"
            today_diff=$(( today_ts - now ))
            tomorrow_diff=$(( tomorrow_ts - now ))
            if [ "$today_diff" -lt 0 ]; then today_diff=$(( -today_diff )); fi
            if [ "$tomorrow_diff" -lt 0 ]; then tomorrow_diff=$(( -tomorrow_diff )); fi
            if [ "$today_diff" -le "$tomorrow_diff" ]; then
              chosen_ts="$today_ts"
            else
              chosen_ts="$tomorrow_ts"
            fi
            target_date="$(date -u -d "@${chosen_ts}" +%Y-%m-%d)"
            publish_at="$(date -u -d "@${chosen_ts}" +%Y-%m-%dT%H:%M:%SZ)"
          }

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            slot="${INPUT_SLOT:-0}"
            if [ -n "${INPUT_PUBLISH_AT:-}" ]; then
              publish_at="$INPUT_PUBLISH_AT"
              target_date="${publish_at%%T*}"
            else
              publish_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
              target_date="$(date -u +%Y-%m-%d)"
            fi
          elif [ "$EVENT_SCHEDULE" = "30 1 * * *" ] || [ "$EVENT_SCHEDULE" = "30 4 * * *" ]; then
            slot=1
            nearest_slot 09 30
          elif [ "$EVENT_SCHEDULE" = "30 9 * * *" ] || [ "$EVENT_SCHEDULE" = "30 12 * * *" ]; then
            slot=2
            nearest_slot 16 30
          else
            slot=0
            nearest_slot 01 30
          fi
          {
            echo "SHORTS_SLOT=$slot"
            echo "SHORTS_TARGET_DATE=$target_date"
            echo "SHORTS_PUBLISH_AT=$publish_at"
          } >> "$GITHUB_ENV"
          echo "Target: ${{ matrix.channel }} slot $slot, date $target_date, publish at $publish_at"

      - name: Build and upload the Short
        env:
          SHORTS_TOPIC: ${{ inputs.topic }}
          SHORTS_FORMAT: ${{ inputs.format }}
          SHORTS_DRY_RUN: ${{ inputs.dry_run }}
          SHORTS_TOPIC_OFFSET: ${{ matrix.offset }}
          YOUTUBE_TOKENS_PATH: ${{ matrix.tokens }}
        run: node scripts/ci-daily-short.js

      - name: Keep the rendered Short
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: short-${{ matrix.channel }}-${{ github.run_id }}
          path: |
            data/ranked-shorts/**/final.mp4
            data/ranked-shorts/**/thumbnail.jpg
            data/ranked-shorts/**/episode.json
          if-no-files-found: ignore
          retention-days: 14
